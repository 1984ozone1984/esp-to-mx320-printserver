# MX320 WiFi Print Server — test plan. Owned by /build.
#
# Every test, what it needs, and what it last produced. Status is written by
# whatever ran the test, never by hand: not done | successful | failed, with the
# commit it ran against. "Blocked" is computed from `needs` against
# `capabilities`, never typed.
#
# Contract: docs/Functionality/FSD.md · Rules: docs/Method/standards/testing.md

project: mx320-printserver
fsd: docs/Functionality/FSD.md
dut:
  board: Seeed XIAO ESP32-S3
  chip: esp32s3
  flash: 8MB              # FSD NFR-2.2
  psram: 8MB octal        # FSD NFR-2.3
  console: UART0 GPIO43/44 via a USB-UART adapter on a bench slot (FSD NFR-2.4)
  slot: SLOT3             # UART console (FT232R 0403:6001, /dev/ttyUSB0); tests find the DUT by MAC
  mac: dc:da:0c:57:57:a0  # POST /api/chip/info 2026-11-02 (SLOT4, native USB)
  observed: >-
    2026-11-02 /api/chip/info: ESP32-S3 (QFN56) rev v0.2, flash 8MB (GD c8/4017,
    quad eFuse, run as DIO), embedded PSRAM 8MB (octal_psram: 64 Mbit, gen 3),
    40 MHz crystal. Matches FSD NFR-2.1-2.3.
  cold_flash_slot: SLOT4  # XIAO native USB (303a:1001) while its USB-C is on the Pi: bench cold flash only (FSD §2.2); OTA otherwise
testbench:
  # Dated observation, not an address to hard-code: tests take TESTBENCH_URL
  # from the environment.
  hostname: testbench-de09
  last_seen_ip: 192.168.8.70
  url: http://192.168.8.70:8080
  harness_ref: db6a093    # Embedded-AI-Harness commit pinned in .devcontainer/Dockerfile
  last_seen: 2026-11-02   # GET /api/info; /api/wifi/mode = wifi-testing

capabilities:
  # --- Bench capabilities: declared by the testbench (Harness-FSD Appendix D)
  # and taken at face value; a project never proves them. Open bench issues
  # that limit them are recorded with their consequence for this project.
  bench-flash:
    what: Flash images at explicit offsets through POST /api/flash (bridge-chip boards)
    available: yes
    limitation: >-
      Embedded-AI-Harness#52 — only the first option of a flash_args line is applied
      (images flashed at 40 MHz). Consequence: none for correctness; boot timing may
      differ from a USB-flashed unit.
  bench-flash-read:
    what: Read a flash region back with its SHA-256 through POST /api/flash/read; resets the DUT. Unusable over the UART slot (no BOOT/EN); FSD §25.0 slot read is GET /api/slots instead
    available: yes
  bench-chip-info:
    what: Read chip, flash size and MAC through POST /api/chip/info — FSD §25.0 "chip read"; resets the DUT
    available: yes
  bench-serial-monitor:
    what: Capture DUT console lines with pattern match and a recorded buffer (/api/serial/monitor, /api/serial/output)
    available: yes
    limitation: >-
      Embedded-AI-Harness#57 — the first boot after /api/flash is not recorded.
      Consequence: tests reset once after flashing before reading the boot marker.
  bench-serial-write:
    what: Write a line to the DUT console (POST /api/serial/write) — the test build's `cred` command (FSD FR-19.1)
    available: yes
    limitation: >-
      Observed 2026-11-02 on SLOT3: POST /api/serial/write intermittently answers
      "cannot reach the proxy on 4003: Remote does not seem to support RFC2217"
      after its own ~19 s of retries (the slot's RFC2217 port is single-client).
      Consequence: tests/bench/dut.py waits 45 s per call and retries up to 3 times.
  bench-serial-reset:
    what: Hard-reset the DUT through POST /api/serial/reset (DTR/RTS or EN GPIO)
    available: yes
  bench-gpio:
    what: Drive Pi GPIO 16-27 high/low/high-Z (POST /api/gpio/set) — unused by this project (no BOOT/EN wiring, dut-boot-en)
    available: yes
  bench-wifi-ap:
    what: Start and stop the bench SoftAP on demand (/api/wifi/ap_start, ap_stop) — AP outages for WiFi-recovery tests
    available: yes
    limitation: >-
      Embedded-AI-Harness#54 — the bench AP refuses re-authentication from a station
      that reset; #61 — ap_status.stations stays empty. Consequence: tests that reboot
      the DUT on the bench AP restart the AP first; station presence is read from the
      DUT's own /api/status, not from ap_status.
  bench-wifi-sta:
    what: Join a DUT SoftAP as a station and relay HTTP through it (/api/wifi/sta_join, /api/wifi/http) — captive-portal provisioning
    available: yes
    limitation: >-
      Embedded-AI-Harness#56 — TestbenchDriver.enter_portal() does not match
      /api/enter-portal. Consequence: provisioning uses sta_join + /api/wifi/http
      directly (procedure P-PROVISION). Running this station while the bench AP is
      up is not declared by the bench, nor is relay DNS through the DUT's catch-all (FSD OD-6). Consequence: FR-2.18, FR-12.1, FR-12.2 and FR-12.3
      stay blocked until the bench declares it or the FSD amends their stimulus.
  bench-ap-tcp:
    what: Raw TCP from the test host to a DUT on the bench AP (192.168.4.0/24) — RAW :9100 jobs during AP toggling (FSD OD-7)
    available: no
    consequence: >-
      Embedded-AI-Harness#65 (routed path requested). The bench relays HTTP only (/api/wifi/http). FR-2.14, FR-2.15 and the
      `job: abort … reason=wifi` marker are blocked until a testbench change request
      adds a TCP relay or a routed path.
  bench-wifi-scan:
    what: WiFi scan from the bench radio (GET /api/wifi/scan)
    available: yes
    limitation: >-
      Embedded-AI-Harness#50 — refuses while the bench AP runs; no BSSID. Consequence:
      SoftAP-absent checks (FR-12.5) scan with the bench AP stopped.
  bench-udplog:
    what: Receive DUT UDP log lines on port 5555 (GET /api/udplog)
    available: yes
  bench-mqtt-broker:
    what: Start/stop the mosquitto test broker on the bench (/api/mqtt/start, stop) — broker outages; DUTs reach it at 192.168.4.1:1883, the test host subscribes on the bench's LAN address :1883
    available: yes
    limitation: >-
      Embedded-AI-Harness#59 — the broker never writes its log. Consequence: broker
      outage timestamps come from the test's own start/stop calls.
  bench-usb-power-cycle:
    what: Switch a slot's USB power off and on
    available: no
    limitation: >-
      Embedded-AI-Harness#51 (open). Consequence: none directly — the printer hangs off
      the DUT's own hub, not a bench slot; printer detach uses `printer-detach`.
  bench-operator-prompt:
    what: Block on an operator yes/no answered in the portal UI (POST /api/human-interaction)
    available: yes
  bench-test-progress:
    what: Live test-session progress on the portal (/api/test/update)
    available: yes

  # --- Project-side: unproven until observed working here. Each is an item on
  # testing/debugging-agenda.md; /commission flips it to yes (or records no
  # with its consequence).
  dut-on-slot:
    what: The XIAO ESP32-S3 sits on a bench slot through a USB-UART adapter on D6/D7, a CI artefact flashed at its flash_args offsets boots, and its UART console is readable
    available: yes
    observed: >-
      2026-11-02 CI run 41478532668 (Build Firmware, main @ 6670ffb), artefact
      firmware-6670ffb/coldflash flashed via POST /api/flash at flash_args offsets
      0x0 bootloader, 0x8000 partition-table, 0xf000 ota_data_initial,
      0x20000 mx320-printserver.bin (hash verified). After a reset, SLOT3 UART at
      115200 showed `App version: 6670ffb`, `GPIO 44 and 43 are used as console UART
      I/O pins`, `Found 8MB PSRAM device`, `main: Init complete`.
    limitation: >-
      The flash went over the XIAO's USB-C on SLOT4: the adapter cannot enter
      download mode until BOOT/EN are wired (esptool on SLOT3: "No serial data
      received"). Consequence: flashing through the adapter is proven under
      dut-boot-en; BOOT/EN are not wired (FSD 0.1.19), so every later image goes by
      OTA and a cold flash uses this same USB-C route (FSD §2.2).
  dut-boot-en:
    what: Bench GPIO18/17 drive the XIAO's GPIO0 (BOOT) and EN — download mode (flashing through the adapter on SLOT3), reset, and the 10 s factory-reset hold (FR-2.17)
    available: no
    consequence: >-
      Not wired, by user decision (FSD 0.1.19). Resets use the test build's `reboot`
      (FR-19.5) or an operator power-cycle; NVS erase uses `wipe` (FR-19.6) or a cold
      flash; updates go by OTA; BOOT presses (FR-2.17, FR-2.19, NFR-2.6) are operator
      acts observed through `button: held`. bench-serial-reset and bench-gpio are unused.
  usb-host-hub-power:
    what: With the XIAO on the active hub's upstream port, the hub enables its downstream ports and the ESP sees devices attach (FSD R1)
    available: unproven
  printer-mx320:
    what: The MX320 behind the hub exposes a class 07/01 printer interface and returns an IEEE 1284 Device ID to the ESP (FSD A1, R2)
    available: unproven
  printer-port-status:
    what: The MX320's 1284 port-status bits change with paper out / error (FSD R3, OD-3)
    available: unproven
  usb-printer-sink:
    what: A USB printer-class device that records every bulk-OUT byte, can pause (NAK) on command, and returns a set Device ID (incl. zero-length or STALL) and port status (FSD §25.0, OD-4)
    available: no
    consequence: >-
      Does not exist yet (FSD OD-4 is authoritative). Byte-exact contracts (FR-2.15,
      FR-6.1-6.6, FR-6.8, FR-6.10, NFR-6.1, FR-11.5, FR-13.5, FR-13.6, NFR-17.2) run only
      against the real MX320 without byte comparison; FR-7.2 (b), FR-8.6 and
      FR-13.1 (c) cannot run at all until it is built.
  printer-detach:
    what: Detach and re-attach the printer's USB on demand while the DUT runs (operator prompt, or a switchable hub port)
    available: unproven
  mx320-job-file:
    what: A rendered one-page MX320 print job (driver print-to-file), committed under tests/data/, that prints a known page
    available: unproven
  lan-clients:
    what: A Mac with an MX320 driver (Gutenprint) and a Windows PC with the Canon MX320 driver, on the home LAN (FSD D2, D3, R4)
    available: unproven
    note: >-
      2026-11-02 user decision: all client-side tests run with the Mac first; the
      Windows PC is down. Windows-dependent work (AT-2, the Windows half of agenda
      #8) waits until it is back; the requirement is unchanged.
  home-wlan:
    what: Home WLAN per FSD A2 (2.4 GHz, WPA2-PSK, DHCP), credentials as HOME_WIFI_SSID / HOME_WIFI_PASS (devcontainer env from the host env; on the Unraid session, KEY=value file /mnt/code/secrets/mx320-home-wifi.env outside every repo — never committed), devcontainer, Mac, PC and DUT on one L2 segment for mDNS
    available: yes
    observed: >-
      2026-11-02 bench GET /api/wifi/scan: the home SSID on channel 1 (-48 dBm),
      6, 11 (2.4 GHz) and 36 (5 GHz), all WPA2. mDNS browse from 192.168.8.183 saw
      the Mac ("MacBook Air von Stefan", Mac14,2, 192.168.8.157) — same /24 as the
      bench (192.168.8.70). Bench station joined the home WLAN and was leased
      192.168.8.176, gateway 192.168.8.1 (then left).
    limitation: >-
      The Windows PC is down and has not been seen on mDNS. Consequence: Windows
      client checks wait (Mac-first decision); agenda #11 stays open for the PC only.
  ha-broker:
    what: The Home Assistant MQTT broker, reachable from the home WLAN and from the devcontainer (HA_MQTT_HOST/HA_MQTT_USER/HA_MQTT_PASS, same secrets file as home-wlan)
    available: yes
    observed: >-
      2026-11-02: HA_MQTT_HOST = ha-test.local, resolved by mDNS to 192.168.8.32;
      port 1883 with the stored user/password: CONNACK Success; a QoS 1 publish to
      a fresh mx320/commission/<id> topic came back on the same client's
      subscription. HA's own MQTT listener was not observed (broker-level proof).
    limitation: >-
      The broker is named by a .local host; the DUT resolves it by mDNS (FSD
      FR-13.9, user decision 2026-11-02). Tests other than FR-13.9 may use the
      resolved IPv4 address.
  usb-test-peripherals:
    what: A second USB hub (cascade for NFR-2.7) and a USB flash drive (FR-8.5, FR-8.8) on the product hub
    available: unproven
  dut-power-cycle:
    what: Power the DUT off and on as FSD §2.2 defines — on a bench prompt the operator unplugs the XIAO's USB-C from the Pi (Phase 1) or disconnects the hub's 5 V supply (Phase 2 on); in both the UART adapter is not a power path to the XIAO
    available: unproven
    observed: >-
      Phase 1 variant proven 2026-11-02: operator unplugged the XIAO's USB-C from
      the Pi with the UART adapter connected, re-plugged it after the second prompt;
      SLOT3 UART then showed `rst:0x1 (POWERON),boot:0x8 (SPI_FAST_FLASH_BOOT)` at
      17:32:11 UTC — the chip lost power, so TX/RX do not back-power it. The hub
      5 V variant (Phase 2 on) is still unproven (agenda #13).
    limitation: >-
      SLOT4's hotplug state did not change during the unplug (last_event_ts stayed
      16:39:49 UTC) and the SLOT3 capture during a concurrent /api/serial/monitor
      shows duplicated lines and dropped characters. Consequence: tests match
      markers on the recorded buffer with tolerance for a duplicate, and do not use
      SLOT4 presence as power-off evidence.
  operator:
    what: A person at the bench answers portal prompts (page printed, paper removed, printer unplugged)
    available: yes
    observed: >-
      2026-11-02 17:31 UTC: POST /api/human-interaction "click DONE" returned
      {"ok": true, "confirmed": true}; "click CANCEL" returned {"ok": true,
      "confirmed": false}. Both answers reached the caller within 7 s.
  release-verification:
    what: Tag-triggered journey run against the released artifact (.github/workflows/build.yml verify job on the devcontainer runner)
    available: unproven
    note: >-
      Runner installed in .devcontainer/ but not registered (an owner grant:
      .devcontainer/runner/register.sh). Repo variables set 2026-11-02:
      TESTBENCH_URL=http://192.168.8.70:8080, DUT_SLOT=SLOT3. Postponed by the user
      2026-11-02: the runner host is Tower (docker run --network host, repo at
      /mnt/user/code-working-dir/esp-to-mx320-printserver, PAT in
      /mnt/user/appdata/mx320/runner.env), but the mx320-dev image does not fit
      Unraid's 20 GB Docker vDisk (11 GB free; espressif/idf:v6.0.2 unpacks to
      more) — needs a larger vDisk first.
      Once proven, an absent bench at verify time is an unmet precondition (not done),
      not a loss of the capability.

tests:
  # The journey — the standard run (harness question 2, home-LAN variant).
  # One test per step; workflow shape; the gate every hardware session runs behind.
  - id: JRN-01.1
    name: Flash the release image, boot unprovisioned
    shape: workflow
    kind: standard
    wave: 1
    phase: 1
    tier: bench
    verifies: [NFR-2.4, FR-20.1]
    needs: [bench-flash, bench-operator-prompt, operator, bench-serial-monitor, dut-on-slot, dut-power-cycle]
    observable: 'bench cold flash (FSD §2.2: operator moves USB-C to the Pi), with erase, ok at flash_args offsets; after the operator power-cycles, UART shows `boot: fw=<expected version>` then `state: PROVISIONING`'
    impl: null
    status: not done
    reason: test not written
  - id: JRN-01.2
    name: Provision through the captive portal
    shape: workflow
    kind: standard
    wave: 1
    phase: 4
    tier: bench
    verifies: [FR-2.10, FR-12.1]   # FR-12.2, FR-12.3, FR-2.18 contracts use the bench AP: their own wave tests
    needs: [bench-wifi-sta, home-wlan]
    observable: bench joins `MX320-Setup-<id>`, setup page served, home-WLAN credentials + admin password submitted and accepted; SoftAP gone within 5 s of the test-join
    impl: null
    status: not done
    reason: test not written
  - id: JRN-01.3
    name: DUT operational on the home WLAN
    shape: workflow
    kind: standard
    wave: 1
    phase: 1
    tier: bench
    verifies: [FR-2.11, FR-2.12]
    needs: [bench-serial-monitor, home-wlan]
    observable: 'UART `wifi: got ip <ip>`; GET http://<ip>/api/status from the devcontainer returns `state: OPERATIONAL`'
    impl: null
    status: not done
    reason: test not written
  - id: JRN-01.4
    name: Printer claimed
    shape: workflow
    kind: standard
    wave: 1
    phase: 2
    tier: bench
    verifies: [FR-8.1, FR-8.2, FR-8.9]
    needs: [usb-host-hub-power, printer-mx320]
    observable: '/api/status `printer.present: true`, `mdl` = the MX320''s 1284 MDL (expected "MX320 series"), `status: ready`'
    impl: null
    status: not done
    reason: test not written
  - id: JRN-01.5
    name: Printer discoverable via mDNS
    shape: workflow
    kind: standard
    wave: 1
    phase: 3
    tier: bench
    verifies: [FR-10.1, FR-10.2]
    needs: [home-wlan]
    observable: from the devcontainer, `_pdl-datastream._tcp` browse finds the instance on port 9100 with TXT usb_MDL = the claimed MDL; `<hostname>.local` resolves to the DUT IP
    impl: null
    status: not done
    reason: test not written
  - id: JRN-01.6
    name: Print one page
    shape: workflow
    kind: standard
    wave: 1
    phase: 3
    tier: bench
    verifies: [FR-9.1, FR-6.1, FR-6.4, FR-6.9]
    needs: [mx320-job-file, operator, bench-operator-prompt]
    observable: 'job file sent to <ip>:9100 and closed; log `job: done bytes=<file size>`; /api/status job.completed +1; operator confirms the known page printed'
    impl: null
    status: not done
    reason: test not written
  - id: JRN-01.7
    name: Status reaches Home Assistant's broker
    shape: workflow
    kind: standard
    wave: 1
    phase: 4
    tier: bench
    verifies: [FR-13.1, FR-13.3]
    needs: [ha-broker]
    observable: retained `mx320/<id>/availability` = online and `mx320/<id>/state` with job.completed equal to the value after JRN-01.6
    impl: null
    status: not done
    reason: test not written

  # --- FSD Phase 1 slice, Wave 1: standard tests only (deviation / negative /
  # security tests for the Phase 1 exit — FR-2.13, FR-2.16, FR-2.20, FR-11.4,
  # FR-11.6, FR-19.2/19.4/19.7/19.8, NFR-17.1/17.5/17.6 — are not written until
  # their wave opens). Baseline for every bench test: P-BASELINE (testing.md).
  - id: TC-LIFE-01
    name: Lifecycle decision function matches the §2.3 table
    shape: atomic
    kind: standard
    wave: 1
    phase: 1
    tier: host
    verifies: [FR-5.1]
    needs: []
    observable: every listed (state, event, guard) row yields its next state and actions; every unlisted pair yields `ignored`
    impl: 'tests/host/test_lifecycle.c (ctest TC-LIFE-01)'
    status: successful
    commit: e7d7996
  - id: TC-PLAT-01
    name: Boot marker reports the unit on the UART console
    shape: atomic
    kind: standard
    wave: 1
    phase: 1
    tier: bench
    verifies: [NFR-2.3, NFR-2.4, FR-20.1]
    needs: [bench-serial-write, bench-serial-monitor, dut-on-slot]
    observable: 'after `reboot` (FR-19.5), SLOT3 at 115200 shows `boot: fw=<ver> reset=SW count=<n> flash=8 psram=8` within 5 s of the command'
    impl: 'tests/bench/test_phase1.py::test_tc_plat_01_boot_marker'
    status: not done
    reason: feature absent (xfail / WILL_FAIL until it lands)
  - id: TC-PLAT-02
    name: Chip read during a bench cold flash
    shape: atomic
    kind: standard
    wave: 1
    phase: 1
    tier: bench
    verifies: [NFR-2.1, NFR-2.2]
    needs: [bench-flash, bench-chip-info, bench-operator-prompt, operator, dut-on-slot]
    observable: 'during a bench cold flash (FSD §2.2) POST /api/chip/info on the native-USB slot reports ESP32-S3, flash 8MB, MAC dc:da:0c:57:57:a0'
    impl: 'tests/bench/test_phase1.py::test_tc_plat_02_chip_read_during_cold_flash'
    status: not done
    reason: feature absent (xfail / WILL_FAIL until it lands)
  - id: TC-CON-01
    name: cred stores WiFi credentials and the DUT joins
    shape: atomic
    kind: standard
    wave: 1
    phase: 1
    tier: bench
    verifies: [FR-19.1, FR-20.1]
    needs: [bench-serial-write, bench-serial-monitor, bench-wifi-ap, dut-on-slot]
    observable: 'test build after `wipe`: `cred <bench SSID> <pass>` → `cred: stored`; after `reboot` `state: CONNECTING` then `wifi: got ip`'
    impl: 'tests/bench/test_phase1.py::test_tc_con_01_cred'
    status: not done
    reason: feature absent (xfail / WILL_FAIL until it lands)
  - id: TC-CON-02
    name: admin stores the OTA password
    shape: atomic
    kind: standard
    wave: 1
    phase: 1
    tier: bench
    verifies: [FR-19.3, FR-20.1]
    needs: [bench-serial-write, bench-serial-monitor, home-wlan, dut-on-slot]
    observable: '`admin testpass1` → `admin: stored`; POST /api/ota of a valid image with admin:testpass1 answers 200'
    impl: 'tests/bench/test_phase1.py::test_tc_con_02_admin'
    status: not done
    reason: feature absent (xfail / WILL_FAIL until it lands)
  - id: TC-CON-03
    name: reboot restarts the test build
    shape: atomic
    kind: standard
    wave: 1
    phase: 1
    tier: bench
    verifies: [FR-19.5, FR-20.1]
    needs: [bench-serial-write, bench-serial-monitor, home-wlan, dut-on-slot]
    observable: 'OPERATIONAL, boot_count n: `reboot` → `reboot: requested`, then within 5 s `boot: … reset=SW count=<n+1>`'
    impl: 'tests/bench/test_phase1.py::test_tc_con_03_reboot'
    status: not done
    reason: feature absent (xfail / WILL_FAIL until it lands)
  - id: TC-CON-04
    name: wipe erases NVS and returns to PROVISIONING
    shape: atomic
    kind: standard
    wave: 1
    phase: 1
    tier: bench
    verifies: [FR-19.6, FR-20.1]
    needs: [bench-serial-write, bench-serial-monitor, home-wlan, dut-on-slot]
    observable: 'credentials stored, OPERATIONAL: `wipe` → `wipe: done`, then within 5 s `boot: … count=1` and `state: PROVISIONING`'
    impl: 'tests/bench/test_phase1.py::test_tc_con_04_wipe'
    status: not done
    reason: feature absent (xfail / WILL_FAIL until it lands)
  - id: TC-LIFE-02
    name: Stored credentials lead to CONNECTING
    shape: atomic
    kind: standard
    wave: 1
    phase: 1
    tier: bench
    verifies: [FR-2.11, FR-20.1]
    needs: [bench-serial-write, bench-serial-monitor, home-wlan, dut-on-slot]
    observable: 'credentials stored · `reboot`: `state: CONNECTING` ≤ 2 s after the `boot:` marker; no SoftAP'
    impl: 'tests/bench/test_phase1.py::test_tc_life_02_connecting_within_2s'
    status: not done
    reason: feature absent (xfail / WILL_FAIL until it lands)
  - id: TC-LIFE-03
    name: HTTP up within 5 s of the IP (Phase 1 case)
    shape: atomic
    kind: standard
    wave: 1
    phase: 1
    tier: bench
    verifies: [FR-2.12, FR-20.1]
    needs: [bench-serial-write, bench-serial-monitor, home-wlan, dut-on-slot]
    observable: 'credentials stored · `reboot`: GET /api/status answers 200 ≤ 5 s after `wifi: got ip`, never before it; `state: OPERATIONAL` logged'
    impl: 'tests/bench/test_phase1.py::test_tc_life_03_http_within_5s_of_ip'
    status: not done
    reason: feature absent (xfail / WILL_FAIL until it lands)
  - id: TC-STAT-01
    name: Same version in banner and /api/status
    shape: atomic
    kind: standard
    wave: 1
    phase: 1
    tier: bench
    verifies: [FR-18.1]
    needs: [bench-serial-write, bench-serial-monitor, home-wlan, dut-on-slot]
    observable: '`boot: fw=<ver>` equals /api/status `fw`; /api/status carries fw, boot_count, reset_reason, state, heap_free'
